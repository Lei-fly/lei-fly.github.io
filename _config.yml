# Jekyll 配置文件
# Just the Docs 主题

title: 我的知识库
description: Hermes 管理的技术笔记与随笔
theme: just-the-docs

# 启用深色/浅色模式切换
color_scheme: nil
# 允许用户手动切换主题
heading_anchors: true
# 启用搜索功能
search_enabled: true
# 搜索分词
search.tokenizer_separator: /[\s/]+/
# 启用最后一项更新时间
last_edit_timestamp: true
# 显示编辑链接
gh_edit_link: true
gh_edit_link_text: "在 GitHub 上编辑此页"
gh_edit_repository: "https://github.com/Lei-fly/lei-fly.github.io"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# 插件
plugins:
  - jekyll-seo-tag
  - jekyll-feed

# 排除文件
exclude:
  - README.md
  - .gitignore
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore

# Markdown 处理器
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true

# 语言
lang: zh-CN

# giscus 评论配置
giscus:
  repo: "Lei-fly/lei-fly.github.io"
  repo-id: "R_kgDONXXXXX"  # 需要替换为实际的 repo-id
  category: "Announcements"
  category-id: "DIC_kwDONXXXXX"  # 需要替换为实际的 category-id
  mapping: "pathname"
  strict: "0"
  reactions-enabled: "1"
  emit-metadata: "0"
  input-position: "bottom"
  theme: "preferred_color_scheme"
  lang: "zh-CN"

# 自定义导航
nav_external_links:
  - title: GitHub 仓库
    url: https://github.com/Lei-fly/lei-fly.github.io
    hide_arrow: true

# 默认前端页面
defaults:
  - scope:
      path: "notes"
    values:
      layout: "default"
