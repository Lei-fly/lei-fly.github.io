# Jekyll 配置文件
# Just the Docs 主题

title: Lei-fly 的主页
description: GitHub Pages 个人主页与知识库

# 使用远程主题（GitHub Pages 推荐）
remote_theme: just-the-docs/just-the-docs@v0.4.0

# 启用深色/浅色模式切换
color_scheme: nil

# 启用搜索功能
search_enabled: true
search.tokenizer_separator: /[\s/]+/

# 启用最后一项更新时间
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d %H:%M"

# 显示编辑链接
gh_edit_link: true
gh_edit_link_text: "在 GitHub 上编辑此页"
gh_edit_repository: "https://github.com/Lei-fly/lei-fly.github.io"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# 插件
plugins:
  - jekyll-seo-tag
  - jekyll-feed

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - _config_theme.yml

# Markdown 处理器
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true

# 语言
lang: zh-CN

# giscus 评论配置
giscus:
  repo: "Lei-fly/lei-fly.github.io"
  repo-id: "R_kgDONXXXXX"
  category: "Announcements"
  category-id: "DIC_kwDONXXXXX"
  mapping: "pathname"
  strict: "0"
  reactions-enabled: "1"
  emit-metadata: "0"
  input-position: "bottom"
  theme: "preferred_color_scheme"
  lang: "zh-CN"

# 自定义导航
nav_external_links:
  - title: GitHub 仓库
    url: https://github.com/Lei-fly/lei-fly.github.io
    hide_arrow: true

heading_anchors: true

defaults:
  - scope:
      path: "notes"
    values:
      comments: true
